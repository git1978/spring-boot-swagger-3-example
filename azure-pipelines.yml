trigger:
- develop

steps:
- checkout: self  # Ensures the source code is checked out

# Set up Java 17 using Microsoft-provided JDK
- task: Maven@3
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'  # Increases memory if needed
    javaHomeOption: 'JDKVersion'  # Uses a specific Java version
    jdkVersionOption: '17'  # Use Java 17
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'clean install'

# Optional: Upload the built JAR as an artifact
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: 'target/*.jar'  # Adjust if your JAR is located elsewhere
    artifactName: 'drop'
