spring:
  application:
    name: cloud-api-java3
  datasource:
    url: jdbc:mysql://localhost:3306/GDTDB # Update with your actual DB name
    username: root # Update with your actual DB username
    password: root # Update with your actual DB password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080
logging:
  level:
    org.springframework.web: INFO
    org.hibernate: ERROR
