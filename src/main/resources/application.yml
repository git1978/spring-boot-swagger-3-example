server:
  port: 8080  # Change le port du serveur

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/GDTDB # Update with your actual DB name
    username: root # Update with your actual DB username
    password: root # Update with your actual DB password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  logging:
    level:
      org.springframework.orm.jpa: DEBUG
      org.hibernate: DEBUG

# Swagger configuration (if needed)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    bezkoder: debug  # Remplace 'bezkoder' par ton package
  file:
    name: /Users/younessabach/Documents/dev/workspaceJava/spring-boot-swagger-3-example/logs/application.log  # Fichier log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
